# Cloudflare Pages 설정. npm run deploy (wrangler pages deploy) 가 읽는다.
name = "sapphire-guild"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
# 답을 돌려준 뒤에 폰 알림을 마저 보내려고 요청마다 waitUntil 을 기억한다 (server/background.ts, AsyncLocalStorage 만 켠다)
compatibility_flags = ["nodejs_als"]

# 길드 계정 DB. 처음 한 번 `npx wrangler d1 create sapphire-accounts` 로 만들고,
# 거기서 나온 database_id 를 아래에 넣는다. (README 의 '길드 계정 처음 설정' 참고)
[[d1_databases]]
binding = "DB"
database_name = "sapphire-accounts"
database_id = "00000000-0000-0000-0000-000000000000"

# 사용 기록 DB 2~10 (server/logdb.ts, 제작자 요청 2026-11-02: 무료 DB 10개를 미리 만들고 차례로 채운다).
# 자동 배포(scripts/ci-d1.mjs)가 없으면 만들고 아래 database_id 를 그 DB 것으로 바꾼다 (끝자리가 DB 번호인 자리 표시).
[[d1_databases]]
binding = "LOG2"
database_name = "sapphire-log-2"
database_id = "00000000-0000-0000-0000-000000000002"

[[d1_databases]]
binding = "LOG3"
database_name = "sapphire-log-3"
database_id = "00000000-0000-0000-0000-000000000003"

