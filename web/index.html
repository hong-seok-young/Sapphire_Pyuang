<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141831" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sapphire" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Sapphire 아이모 위키</title>
    <style>
      /* 앱 코드가 뜨기 전 첫 화면 (배포 직후 새 코드를 받는 동안 까만 화면만 보이지 않게, 제작자 요청) */
      html, body { margin: 0; background: #141831; }
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px; box-sizing: border-box; color: #f3f0ff; text-align: center; word-break: keep-all;
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .boot img { width: 72px; height: 72px; image-rendering: pixelated; animation: boot-bob 1.2s ease-in-out infinite; }
      .boot b { font-size: 22px; color: #ffc35c; letter-spacing: 1px; }
      .boot p { margin: 0; font-size: 14px; color: #a9a2cf; line-height: 1.6; }
      .boot .boot-slow { display: none; }
      .boot.slow .boot-slow { display: block; }
      .boot.updating #boot-msg { color: #ffc35c; }
      @keyframes boot-bob { 50% { transform: translateY(-6px); } }
    </style>
    <script>
      // 배포 뒤 폰이 예전 페이지를 들고 있으면 없어진 예전 코드 파일을 찾다 멈춘다. 그때 한 번만 새로 불러온다 (30초 안에 또 하지 않음)
      (function () {
        function retry() {
          try {
            var last = Number(sessionStorage.getItem("sapphire-reload") || 0);
            if (Date.now() - last < 30000) return;
            sessionStorage.setItem("sapphire-reload", String(Date.now()));
          } catch (e) {}
          var msg = document.getElementById("boot-msg");
          if (msg) msg.textContent = "새로 업데이트됐어요. 새 버전으로 다시 불러올게요…";
          setTimeout(function () { location.reload(); }, 600);
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK") && (t.src || t.href || "").indexOf("/assets/") >= 0) retry();
        }, true);
        window.addEventListener("vite:preloadError", function (e) { e.preventDefault(); retry(); });
        // 앱이 4초 안에 안 뜨면 기다려 달라는 글을 더한다
        setTimeout(function () {
          var boot = document.getElementById("boot");
          if (boot) boot.className += " slow";
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot" class="boot">
        <img src="icon-192.png" alt="" />
        <b>Sapphire</b>
        <p id="boot-msg">불러오는 중…</p>
        <p class="boot-slow">잠시만 기다려 주세요.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 첫 화면 글은 처음부터 정한다 (제작자 요청): 코드 파일 이름(빌드마다 바뀜)이 지난번과 다르면 업데이트,
      // 같으면 새로고침, 처음 여는 거면 '불러오는 중'. 지난번 이름은 main.tsx 의 noticeUpdate 가 적어 둔다
      (function () {
        var code = document.querySelector('script[type="module"][src*="/assets/"]');
        var msg = document.getElementById("boot-msg");
        var boot = document.getElementById("boot");
        if (!code || !msg || !boot) return;
        var before = null;
        try { before = localStorage.getItem("sapphire-build"); } catch (e) {}
        if (before && before !== code.src) {
          msg.textContent = "업데이트가 있어요. 새 버전을 반영하는 중…";
          boot.className += " updating";
        } else if (before) {
          msg.textContent = "새로고침 중…";
        }
      })();
    </script>
  </body>
</html>
