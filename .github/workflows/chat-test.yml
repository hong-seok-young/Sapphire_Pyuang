# 챗봇 답 시험 (제작자 요청 2026-11-06 '유물깡에 대한 질문하고 테스트도 해 보고'). 손으로 돌린다: 질문을 넣으면 실서비스의 공식 글·그림 글자와 과금 계산 자료로
# 진짜 챗봇과 같은 지시문·모델에 묻고 답을 실행 기록에 찍는다 (web/scripts/chat-test.mjs). 공개 저장소라 길드 앱 자료와 위키 자료(비공개)는 붙이지 않는다.
name: Chat test

on:
  workflow_dispatch:
    inputs:
      question:
        description: "챗봇에 물을 질문"
        type: string
        required: true

permissions:
  contents: read

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Ask
        working-directory: web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          QUESTION: ${{ inputs.question }}
        run: node --import ./scripts/ts-hooks.mjs --experimental-strip-types scripts/chat-test.mjs "$QUESTION"
