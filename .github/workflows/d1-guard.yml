# D1 하루 무료 사용량 감시 (2026-11-14, web/scripts/d1-guard.mjs, server/readSaver.ts). 15분마다 읽은 양을 재서 60%·80% 를 넘으면
# 무거운 기능을 쉬게 하고 앱개발자에게 알린다. 공개 실행 기록에는 % 만 찍는다.
name: D1 guard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF2_API_TOKEN: ${{ secrets.CF2_API_TOKEN }}
      CF2_ACCOUNT_ID: ${{ secrets.CF2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        run: node web/scripts/d1-guard.mjs
