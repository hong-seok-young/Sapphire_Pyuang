# 개발 요청·챗봇 개선 목록을 Claude 가 읽게 실행 기록에 찍는다 (제작자 2026-11-09 '너가 DB 들어가서 보면 되잖아', '암호화 하지 마, 중요한 거 없음').
# 손으로만 돈다. 읽기만 하고 DB 를 바꾸지 않는다. 비밀번호·세션 같은 칸은 읽지 않는다.
name: DB peek

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Read
        working-directory: web
        run: |
          q() { echo "==== $1 ===="; npx wrangler d1 execute sapphire-accounts --remote --json --command "$2" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.search(/[[{]/)));for(const r of j[0]?.results??[])console.log(JSON.stringify(r))})'; }
          q dev_requests "SELECT * FROM dev_requests ORDER BY id"
          q dev_request_steps "SELECT * FROM dev_request_steps ORDER BY id"
          q dev_request_talk "SELECT * FROM dev_request_talk ORDER BY id"
          q chat_gaps "SELECT * FROM chat_gaps ORDER BY id"
