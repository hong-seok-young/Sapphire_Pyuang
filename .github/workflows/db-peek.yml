# 개발 요청·챗봇 개선 목록을 Claude 가 읽게 실행 기록에 찍는다 (제작자 2026-11-09 '너가 DB 들어가서 보면 되잖아', '암호화 하지 마, 중요한 거 없음').
# 손으로만 돈다. 읽기만 하고 DB 를 바꾸지 않는다. 비밀번호·세션 같은 칸은 읽지 않는다.
name: DB peek

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Read
        working-directory: web
        run: |
          W="$GITHUB_WORKSPACE/web/node_modules/.bin/wrangler"; cd "$RUNNER_TEMP"
          q() { echo "==== $1 ===="; "$W" d1 execute sapphire-accounts --remote --json --command "$2" > out.txt || true; node -e 'const s=require("fs").readFileSync("out.txt","utf8");try{const j=JSON.parse(s.slice(s.search(/[[{]/)));const r=Array.isArray(j)?j[0]?.results:null;if(!r)console.log(s.slice(0,2000));else for(const x of r)console.log(JSON.stringify(x))}catch(e){console.log("parse fail:",s.slice(0,2000))}'; }
          q dev_requests "SELECT * FROM dev_requests ORDER BY id"
          q dev_request_steps "SELECT * FROM dev_request_steps ORDER BY id"
          q dev_request_talk "SELECT * FROM dev_request_talk ORDER BY id"
          q chat_gaps "SELECT * FROM chat_gaps ORDER BY id"
          # 열린 항목마다 그 답(msg_id 는 그 답의 번호)에 붙었던 자료 이름(화면이 찾은 위키 자료 found)과 한 일(웹 찾기 등) 수: 자료가 있는데 안 붙은 것인지 가리려고 (챗봇 개선 2026-11-10)
          q chat_gaps_found "SELECT g.id AS gap, a.id AS answer_id, a.found AS found, length(COALESCE(a.steps, '')) AS steps_len, length(a.text) AS answer_len, a.think_ms AS think_ms FROM chat_gaps g LEFT JOIN chat_msgs a ON a.id = g.msg_id WHERE g.status = 'open' ORDER BY g.id"
          # 물건 이름 (제작자 2026-11-12 '아이콘이 비어 있다': 글에 적은 이름이 게임 이름과 달라 그림을 못 찾는 것을 가리려고. 이름·종류만, 사람 이름은 읽지 않는다)
          q market_items "SELECT l.id, l.item, l.category, l.side, l.status, (SELECT COUNT(*) FROM listing_shots s WHERE s.listing_id = l.id) AS shot FROM listings l ORDER BY l.id"
          q rental_weapons "SELECT weapon, COUNT(*) AS n FROM rental_items WHERE status != 'gone' GROUP BY weapon ORDER BY weapon"
          q donate_names "SELECT item, COUNT(*) AS n FROM donate_items WHERE status IN ('request', 'done', 'hall', 'honor') GROUP BY item ORDER BY item"
