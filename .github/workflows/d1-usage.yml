# D1 하루 읽기(무료 500만 줄) 를 어떤 쿼리가 쓰는지 본다 (2026-11-14 읽기 한도 넘어 사이트가 멈춤). 손으로만, 읽기만.
# 쿼리 글(바인딩 값 없이)과 읽은 줄 수만 찍는다.
name: D1 usage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Top queries
        run: |
          cat > q.mjs <<'JS'
          const acc = process.env.CLOUDFLARE_ACCOUNT_ID, tok = process.env.CLOUDFLARE_API_TOKEN;
          const gql = async (query, variables) => {
            const r = await fetch("https://api.cloudflare.com/client/v4/graphql", { method: "POST", headers: { authorization: `Bearer ${tok}`, "content-type": "application/json" }, body: JSON.stringify({ query, variables }) });
            return r.json();
          };
          const end = new Date(), start = new Date(end.getTime() - 24 * 3600e3);
          const day = end.toISOString().slice(0, 10), prev = start.toISOString().slice(0, 10);
          const a = await gql(`query($a:String!,$s:Date!,$e:Date!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:200,filter:{date_geq:$s,date_leq:$e},orderBy:[date_ASC]){sum{readQueries writeQueries rowsRead rowsWritten} dimensions{date databaseId}}}}}`, { a: acc, s: prev, e: day });
          console.log("== per db per day"); console.log(JSON.stringify(a.errors ?? a.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups, null, 0).slice(0, 6000));
          const q = await gql(`query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){d1QueriesAdaptiveGroups(limit:60,filter:{datetime_geq:$s,datetime_leq:$e},orderBy:[sum_rowsRead_DESC]){sum{rowsRead rowsWritten} count dimensions{query databaseId}}}}}`, { a: acc, s: `${day}T00:00:00Z`, e: end.toISOString() });
          console.log("== top queries today (UTC)");
          const rows = q.data?.viewer?.accounts?.[0]?.d1QueriesAdaptiveGroups;
          if (!rows) console.log(JSON.stringify(q).slice(0, 3000));
          else for (const r of rows) console.log(`${r.sum.rowsRead}\t${r.count}\t${r.dimensions.databaseId.slice(0, 8)}\t${r.dimensions.query.replace(/\s+/g, " ").slice(0, 260)}`);
          JS
          node q.mjs
