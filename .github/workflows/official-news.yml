# 컴투스 공식 소식 받기 (제작자 요청 2026-11-01): 아이모 공식 홈페이지(withhive.com)의 공지사항·점검·이벤트를
# 30분마다 받아 계정 DB(D1)의 official_news 에 넣고 (web/scripts/fetch-official.mjs, 처음이거나 '모든 쪽'을 고르면 전부),
# 글 속 그림의 표·글자를 옮긴 뒤(web/scripts/read-official-images.mjs) To do 의 이벤트 할 일을 Claude 로 정리한다 (web/scripts/digest-official.mjs, 원문이 바뀐 글만,
# 그림 속 글자까지 읽는다). 게시판 '아이모 소식', 챗봇, To do 가 쓴다.
# 점검 글은 서버도 2분마다 새로 받는다 (점검 전광판, web/server/official.ts). 비밀값은 배포(deploy-web.yml)와 같은
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY (ANTHROPIC_WORKSPACE_ID). 공개 저장소라 실행 기록에는 개수만 찍는다.
name: Official news

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "모든 쪽 다시 받기"
        type: boolean
        default: false
      image_budget:
        description: "그림 글자 옮기기에 쓸 시간 (초, 비우면 1200)"
        type: string
        default: ""

concurrency:
  group: official-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.image_budget && 360 || 75 }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Fetch official news
        working-directory: web
        run: node --experimental-strip-types scripts/fetch-official.mjs ${{ inputs.all && '--all' || '' }}

      # 공식 글 속 그림을 글자로 (제작자 요청 2026-11-06 '이벤트에 있는 모든 데이터 이미지 포함해서 싹 다 데이터화'). 새 글의 그림 자리를 만들고
      # 아직 안 옮긴 그림을 새 글 것부터 Claude 로 옮긴다 (scripts/read-official-images.mjs, 20분까지. 손으로 돌릴 때 image_budget 으로 더 길게)
      - name: Official images
        working-directory: web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: node --experimental-strip-types scripts/read-official-images.mjs --budget ${{ inputs.image_budget || '1200' }}

      # 아이모 사기꾼 명단 (제작자 2026-11-11 '업데이트되면 반영'): 카카오 포스트의 표 그림이 바뀌었으면 Claude 로 옮겨 넣는다 (scripts/scam-list.mjs, 공개 기록에는 줄 수만)
      - name: Scam list
        working-directory: web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: node scripts/scam-list.mjs || echo "::warning::사기꾼 명단을 보지 못했어요"

      - name: To do digest
        working-directory: web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: node --experimental-strip-types scripts/digest-official.mjs --budget 1800
