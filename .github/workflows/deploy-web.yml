# 위키 웹앱 자동 배포: main 에 web/ 이 바뀌어 올라오면 GitHub 서버가 위키 자료를 만들고 Cloudflare Pages 에 올린다.
# PC 에서 wrangler 로그인을 하지 않아도 되고, 폰으로 말만 해도 푸시하면 배포된다. Actions 탭에서 직접 다시 돌릴 수도 있다.
#
# 저장소 비밀값 (Settings > Secrets and variables > Actions)
#   CLOUDFLARE_API_TOKEN   Cloudflare API 토큰 (권한: Account > Cloudflare Pages > Edit, Account > D1 > Edit,
#                          Account > Workers Scripts > Edit (챗봇 답 받기 일꾼 web/runner))
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 계정 ID
#   DATA_REPO_TOKEN        비공개 자료 저장소(sapphire-imo-data)를 읽기만 하는 GitHub 토큰
#                          (fine-grained, 그 저장소만, Contents: Read-only). 대신 읽기 전용 배포 키 DATA_DEPLOY_KEY 도 된다
#   DEV_PASSWORD           계정이 하나도 없을 때 만드는 앱개발자(퓨앙) 계정의 첫 비밀번호 (web/scripts/ci-d1.mjs)
#   ANTHROPIC_API_KEY      챗봇이 쓰는 Claude API 키 (없으면 챗봇만 '준비 중')
#   ANTHROPIC_WORKSPACE_ID 키가 워크스페이스에 묶이지 않은 키일 때만: Console 의 워크스페이스 ID (wrkspc_...)
#   FIRST_PASSWORD         시작 계정(길드마스터, 오피서)의 처음 비밀번호. 있으면 그 계정들을 한 번만 만든다
# Cloudflare 비밀값이 아직 없으면 배포를 건너뛴다 (실패로 표시하지 않는다).
# 공개 저장소라 실행 기록은 누구나 볼 수 있다. 비밀번호나 비밀값을 화면에 찍는 단계를 넣지 않는다.
name: Deploy wiki

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
  # 한 주에 한 번은 코드가 안 바뀌어도 돈다: 사용 기록 DB 2~10 이 한 바퀴 돌았을 때 다음 차례 DB 를 미리 비운다 (web/scripts/ci-d1.mjs, server/logdb.ts)
  schedule:
    - cron: "41 19 * * 0"

concurrency:
  group: deploy-wiki
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATA_ACCESS: ${{ secrets.DATA_REPO_TOKEN || secrets.DATA_DEPLOY_KEY }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$DATA_ACCESS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::배포에 필요한 비밀값이 아직 없어서 건너뜀 (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATA_REPO_TOKEN)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      # 위키 원본 자료는 비공개 저장소에 있다 (CLAUDE.md '위키 자료'). 앱 저장소의 자료/ 자리에 받는다
      - name: Wiki source data
        uses: actions/checkout@v4
        with:
          repository: hong-seok-young/sapphire-imo-data
          token: ${{ secrets.DATA_REPO_TOKEN || github.token }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: 자료
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wiki data
        run: |
          pip install --quiet -r web/scripts/requirements.txt
          python web/scripts/build_data.py > build-data.log
          tail -n 3 build-data.log

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Accounts database
        working-directory: web
        env:
          DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
          FIRST_PASSWORD: ${{ secrets.FIRST_PASSWORD }}
        run: node scripts/ci-d1.mjs

      # 장비대여 처음 목록: 비공개 자료의 카카오톡 대여무기 목록 글로 한 번 채운다 (물건이 있으면 건너뛴다, scripts/rental-seed.mjs)
      - name: Rental list (first time)
        working-directory: web
        run: node --experimental-strip-types scripts/rental-seed.mjs || echo "::warning::장비대여 처음 목록을 넣지 못했어요"

      # 컴투스 공식 소식: 최근 글을 새로 받고(30분마다 도는 공식 소식 작업과 같다), 한국 전용 글은 한국 PC에서 받아 둔 파일로 넣는다
      # (withhive 는 한국 밖 서버에는 빼고 준다. 파일은 저장한 때보다 늦게 새로 받은 글을 덮지 않는다, scripts/fetch-official.mjs)
      - name: Official news (Korea snapshot)
        working-directory: web
        run: |
          node --experimental-strip-types scripts/fetch-official.mjs || echo "::warning::공식 소식을 새로 받지 못했어요"
          if [ -f "../자료/공식/소식.json" ]; then node --experimental-strip-types scripts/fetch-official.mjs --load "../자료/공식/소식.json"; fi

      # 챗봇(functions/api/chat.ts)의 Claude API 키를 Cloudflare Pages 비밀값으로 넣는다. 없으면 챗봇은 '준비 중'이라고 답한다
      - name: Chatbot API key
        working-directory: web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler pages secret put ANTHROPIC_API_KEY --project-name sapphire-guild > /dev/null
            echo "챗봇 API 키를 넣었어요"
          else
            echo "::notice::ANTHROPIC_API_KEY 비밀값이 없어서 챗봇은 준비 중으로 보여요"
          fi
          if [ -n "$ANTHROPIC_WORKSPACE_ID" ]; then
            printf '%s' "$ANTHROPIC_WORKSPACE_ID" | npx wrangler pages secret put ANTHROPIC_WORKSPACE_ID --project-name sapphire-guild > /dev/null
            echo "챗봇 워크스페이스 ID를 넣었어요"
          fi

      # 챗봇 답 받기 일꾼 (web/runner, server/chatRun.ts): 앱을 닫아도 답을 끝까지 받아 대화에 넣는 Durable Object (Cloudflare 무료 요금제).
      # 사이트는 Durable Object 를 직접 만들 수 없어서 따로 올리고, 됐으면 사이트 wrangler.toml 에 CHATRUN 바인딩을 붙인다.
      # 못 올리면(토큰에 Workers Scripts 권한이 없는 등) 바인딩 없이 예전처럼 배포한다 (챗봇은 화면이 끊긴 뒤 30초까지만 받는다)
      - name: Chat runner
        continue-on-error: true
        working-directory: web
        run: |
          DBID=$(node -e "const t=require('fs').readFileSync('wrangler.toml','utf8');const m=t.match(/binding = \"DB\"\n(?:[^\n]*\n)*?database_id = \"([^\"]+)\"/);process.stdout.write(m?m[1]:'')")
          if [ -z "$DBID" ]; then echo "::warning::계정 DB id 를 못 찾아서 답 받기 일꾼을 건너뜀"; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$DBID/" runner/wrangler.toml
          if ! npx wrangler deploy --config runner/wrangler.toml > runner-deploy.log 2>&1; then
            tail -n 30 runner-deploy.log
            echo "::warning::챗봇 답 받기 일꾼을 올리지 못했어요 (Cloudflare API 토큰에 Account > Workers Scripts > Edit 권한이 필요해요)"
            exit 1
          fi
          printf '\n[[durable_objects.bindings]]\nname = "CHATRUN"\nclass_name = "ChatRun"\nscript_name = "sapphire-chat-runner"\n' >> wrangler.toml
          echo "챗봇 답 받기 일꾼을 올렸어요"

      - name: Deploy to Cloudflare Pages
        working-directory: web
        run: |
          if npm run deploy; then exit 0; fi
          # 일꾼 바인딩 때문에 실패했으면 빼고 한 번 더
          if grep -q 'name = "CHATRUN"' wrangler.toml; then
            echo "::warning::답 받기 일꾼 바인딩을 빼고 다시 배포해요"
            sed -i '/^\[\[durable_objects.bindings\]\]$/,$d' wrangler.toml
            npm run deploy
          else
            exit 1
          fi

      # 공식 글 속 그림을 글자로 (제작자 요청 2026-11-06 '이벤트에 있는 모든 데이터 이미지 포함해서 싹 다 데이터화'): 사람이 확인한 그림 글(비공개 자료 공식/그림글.json)을 넣고,
      # 새 글의 그림 자리를 만들고, 남은 그림을 Claude 로 5분까지 옮긴다 (scripts/read-official-images.mjs. 남은 것은 30분마다 도는 공식 소식 작업이 한다). 실패해도 배포는 성공으로 둔다
      - name: Official images
        continue-on-error: true
        working-directory: web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: node --experimental-strip-types scripts/read-official-images.mjs --manual ../자료/공식/그림글.json --budget 300

      # To do 의 이벤트 할 일: 아직 정리 안 된 공식 글을 Claude 로 정리한다 (scripts/digest-official.mjs, 그림을 옮긴 뒤 그림 속 글자까지 읽는다, 4분까지. 남은 것은 30분마다 도는 공식 소식 작업이 한다).
      # 사이트 배포가 끝난 뒤에 해서 배포를 늦추지 않고, 실패해도 배포는 성공으로 둔다
      - name: To do digest
        continue-on-error: true
        working-directory: web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: node --experimental-strip-types scripts/digest-official.mjs --budget 240

      # 배포가 끝난 뒤에 한 번 하는 일 (scripts/ci-after.mjs: 챗봇 개선 완료 알림처럼 새 버전이 올라간 뒤에 보내야 하는 것). 실패해도 배포는 성공으로 둔다
      - name: After deploy
        continue-on-error: true
        working-directory: web
        run: node scripts/ci-after.mjs
