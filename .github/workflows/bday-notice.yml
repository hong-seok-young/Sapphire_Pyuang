# 생일 알림 (제작자 요청 2026-11-07 '11월 8일 되는 순간 바로 전원에게 알림 무조건 보내 화려하게'): 한국 시간 0시(UTC 15:00)에
# POST /api/bday/announce 를 여러 번 불러 모두에게 앱 알림과 폰 알림을 보낸다 (web/server/birthday.ts announceBday:
# 첫 번은 알림함과 폰 40대, 다음부터 남은 폰 40대씩. 그날 안에서만, 같은 것을 두 번 보내지 않으므로 비밀값 없이 부른다).
# GitHub 예약은 정각에 늦게 도는 일이 많아 5분 일찍 깨어 0시 5초까지 기다렸다 부른다. 예약이 늦거나 안 돌아도
# /api/news(앱을 연 사람마다 2분마다)가 같은 일을 이어서 한다. 공개 저장소라 실행 기록에는 보낸 수만 찍는다.
name: Birthday notice

on:
  schedule:
    - cron: "55 14 7 11 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Wait for midnight (KST) and send
        run: |
          target=$(date -u -d "2026-11-07 15:00:05" +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ] && [ $((target - now)) -lt 1200 ]; then sleep $((target - now)); fi
          for part in 1 2 3 4 5 6 7 8; do
            out=$(curl -fsS -X POST https://sapphire-guild.pages.dev/api/bday/announce) || { echo "::warning::요청 $part 실패"; sleep 3; continue; }
            n=$(printf '%s' "$out" | tr -cd '0-9')
            echo "요청 $part: 폰 ${n:-0}대"
            if [ "$part" -gt 1 ] && [ "${n:-0}" -lt 40 ]; then break; fi
            sleep 3
          done

      # 0시 전 콤보 기록(앱개발자 미리 보기)을 지운다 (제작자 2026-11-07 '자정에 내 순위 기록 없애서'). 서버의 첫 알림도 같은 것을 지우므로 여기는 한 번 더 확인.
      # 공개 저장소라 지운 수와 남은 수만 찍는다
      - name: Clear preview combo records
        working-directory: web
        run: |
          id=$(npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s.slice(s.indexOf("[")));process.stdout.write((a.find(d=>d.name==="sapphire-accounts")||{}).uuid||"")})')
          [ -n "$id" ] || { echo "::warning::계정 DB 를 못 찾음"; exit 0; }
          sed -i "0,/^database_id = \".*\"$/s//database_id = \"$id\"/" wrangler.toml
          start=$(node -e 'process.stdout.write(String(Date.parse("2026-11-08T00:00:00+09:00")))')
          q() { npx wrangler d1 execute sapphire-accounts --remote --yes --json --command "$1" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s.slice(s.indexOf("[")))[0];process.stdout.write(String(r.results?.[0]?.n ?? 0))})'; }
          cnt="SELECT COUNT(*) AS n FROM bday_combo WHERE bday = 'village-2026' AND at < $start"
          before=$(q "$cnt")
          q "DELETE FROM bday_combo WHERE bday = 'village-2026' AND at < $start" > /dev/null
          after=$(q "$cnt")
          echo "0시 전 기록: 지우기 전 ${before}개 -> 남은 ${after}개"
