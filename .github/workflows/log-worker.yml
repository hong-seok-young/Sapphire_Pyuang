# 둘째 Cloudflare 계정에 사용 기록 DB·일꾼을 올리는 것만 손으로 돌려 본다 (web/scripts/log-worker.mjs, 배포 deploy-web.yml 'Log worker' 와 같은 일).
name: Log worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF2_API_TOKEN: ${{ secrets.CF2_API_TOKEN }}
      CF2_ACCOUNT_ID: ${{ secrets.CF2_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Log worker
        working-directory: web
        run: node scripts/log-worker.mjs
