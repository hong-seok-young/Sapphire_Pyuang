# 도감 계산기에서 '완료'를 누른 사람 세기 (제작자 2026-11-19 '그 완료 누른 사람이 섬예님 뿐인가?').
# 손으로만 돈다. 읽기만 한다. 누른 단추(kind tap, 2026-11-17 부터)의 '완료'·'완료 취소'와 서버 백업(dex_done) 줄 수만 찍는다.
name: Dex peek

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF2_API_TOKEN: ${{ secrets.CF2_API_TOKEN }}
      CF2_ACCOUNT_ID: ${{ secrets.CF2_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Read
        working-directory: web
        run: |
          W="$GITHUB_WORKSPACE/web/node_modules/.bin/wrangler"; cd "$RUNNER_TEMP"
          TAPS="SELECT user_id, date(at/1000,'unixepoch','+9 hours') AS day, detail FROM activity WHERE kind = 'tap' AND what LIKE '#/dex%'"
          for db in sapphire-accounts sapphire-log-2 sapphire-log-3 sapphire-log-4 sapphire-log-5 sapphire-log-6 sapphire-log-7 sapphire-log-8 sapphire-log-9 sapphire-log-10; do
            "$W" d1 execute "$db" --remote --json --command "$TAPS" > "t_$db.txt" 2>&1 || true
          done
          "$W" d1 execute sapphire-accounts --remote --json --command "SELECT user_id, n, datetime(updated_at/1000,'unixepoch','+9 hours') AS kst FROM dex_done ORDER BY n DESC" > done.txt 2>&1 || true
          "$W" d1 execute sapphire-accounts --remote --json --command "SELECT id, main_id FROM users" > users.txt 2>&1 || true
          CLOUDFLARE_API_TOKEN="$CF2_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF2_ACCOUNT_ID" "$W" d1 execute sapphire-log-r1 --remote --json --command "$TAPS" > t_r1.txt 2>&1 || true
          node -e '
            const fs = require("fs");
            const rows = (f) => { try { const s = fs.readFileSync(f, "utf8"); const j = JSON.parse(s.slice(s.search(/[[{]/))); return (Array.isArray(j) ? j[0]?.results : null) || []; } catch { return []; } };
            const main = {}; for (const u of rows("users.txt")) main[u.id] = u.main_id || u.id;
            const per = {};
            for (const f of fs.readdirSync(".").filter((f) => f.startsWith("t_"))) for (const r of rows(f)) {
              let d = []; try { d = JSON.parse(r.detail); } catch {}
              const who = main[r.user_id] || r.user_id;
              const p = (per[who] ||= { on: 0, off: 0, days: new Set(), chars: new Set() });
              p.chars.add(r.user_id);
              for (const t of d) { const n = Number(t[2]) || 1; if (t[1] === "완료") { p.on += n; p.days.add(r.day); } else if (t[1] === "완료 취소") p.off += n; }
            }
            console.log("==== 도감 화면에서 \"완료\"(체크 칸, 탭 단추도 같은 이름) 누른 수: 사람마다 ====");
            for (const [who, p] of Object.entries(per).filter(([, p]) => p.on > 0).sort((a, b) => b[1].on - a[1].on))
              console.log(`${who}\t완료 ${p.on}\t취소 ${p.off}\t날 ${[...p.days].sort().join(",")}\t캐릭터 ${[...p.chars].join(",")}`);
            console.log("==== 서버 백업 dex_done ====");
            for (const r of rows("done.txt")) console.log(`${r.user_id}\t${r.n}\t${r.kst}`);
          '
